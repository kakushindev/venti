name: Build & Push to container registry

on:
  release:
    types: [created]
  push:
    branches:
      - "main"

jobs:
  build:
    uses: kagchi/workflows/.github/workflows/docker-build.yaml@04210c09b633e7f3b191ccf5411966728fb40a4e # main
    permissions:
      packages: write
      contents: read
    secrets: inherit
    with:
      PLATFORMS: linux/amd64
